<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090a0f">
  <link rel="icon" type="image/jpeg" href="./icon.jpg">
  <title>달력 메모 위젯</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background-color: #090a0f;
      color: #f8fafc;
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }
    .widget-shell {
      width: 100%;
      min-height: 100vh;
      background-color: #090a0f;
      padding: 8px 6px 10px 6px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    /* 파스텔 메모 칩: 한글 단어 단위 줄바꿈(keep-all) */
    .w-memo-chip {
      width: 100%;
      color: #0f172a;
      font-size: clamp(8px, 2.25vw, 10px);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1.18;
      padding: 2px 2.5px;
      border-radius: 4px;
      word-break: keep-all;
      overflow-wrap: break-word;
      white-space: normal;
      text-align: left;
      box-sizing: border-box;
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .w-memo-chip-zoom {
      font-size: clamp(9.5px, 2.6vw, 11.5px);
      padding: 3px 3.5px;
      line-height: 1.22;
    }
    /* 근무 표시 칩 (근무+메모 모드용) */
    .w-work-chip {
      width: 100%;
      font-size: clamp(7.5px, 2.0vw, 9px);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 1.15;
      padding: 1.5px 2px;
      border-radius: 3.5px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      box-sizing: border-box;
    }
    .badge-EARLY { background-color: #0284c7; color: #ffffff; }
    .badge-MID   { background-color: #f59e0b; color: #ffffff; }
    .badge-NIGHT { background-color: #4c1d95; color: #fde047; border: 1px solid #7c3aed; }
    .badge-OFF   { background-color: #3f1d28; color: #f87171; border: 1px solid #7f1d1d; }
    .today-cell-box {
      box-shadow: inset 0 0 0 1.8px #3b82f6 !important;
      background-color: rgba(30, 58, 138, 0.22) !important;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="widget-shell">
    <!-- 상단 심플 헤더 -->
    <div class="flex items-center justify-between px-1 pb-1.5 mb-1 border-b border-slate-800/80">
      <div class="flex items-center gap-1.5">
        <button onclick="WidgetApp.changeMonth(-1)" class="w-6 h-6 rounded-lg bg-slate-900 text-slate-400 active:bg-slate-800 font-black text-xs flex items-center justify-center">◀</button>
        <h1 id="w_month_title" onclick="WidgetApp.goToday()" class="text-lg font-black tracking-tight text-white cursor-pointer px-0.5">10월</h1>
        <button onclick="WidgetApp.changeMonth(1)" class="w-6 h-6 rounded-lg bg-slate-900 text-slate-400 active:bg-slate-800 font-black text-xs flex items-center justify-center">▶</button>
        <span id="w_today_sub" onclick="WidgetApp.goToday()" class="text-[10.5px] font-bold text-slate-400 ml-0.5 cursor-pointer">10.27 (화)</span>
      </div>

      <div class="flex items-center gap-1">
        <button id="btn_w_mode" onclick="WidgetApp.cycleViewMode()" class="px-2 py-1 rounded-lg bg-slate-800 text-sky-300 border border-slate-700 text-[9.5px] font-extrabold tracking-tighter active:scale-95">
          📝메모만
        </button>
        <button onclick="WidgetApp.syncFromCloud(false)" id="btn_w_sync" class="w-6 h-6 rounded-lg bg-slate-800 text-emerald-400 border border-slate-700 text-xs font-black flex items-center justify-center active:scale-95" title="새로고침">
          ↻
        </button>
        <button onclick="WidgetApp.openTokenModal()" id="btn_w_key" class="w-6 h-6 rounded-lg bg-slate-800 text-amber-300 border border-slate-700 text-[10px] font-black flex items-center justify-center active:scale-95" title="열쇠 설정">
          🔑
        </button>
        <a href="./index.html" class="px-1.5 py-1 rounded-lg bg-indigo-600/90 text-white text-[9.5px] font-black active:scale-95">본앱↗</a>
      </div>
    </div>

    <!-- 요일 바 (사진 속 다크모드 달력과 동일한 빨강/흰색/파랑 배색) -->
    <div class="grid grid-cols-7 text-center text-[11px] font-extrabold py-1 mb-0.5 bg-slate-900/60 rounded-lg">
      <div class="text-red-500">일</div>
      <div class="text-slate-200">월</div>
      <div class="text-slate-200">화</div>
      <div class="text-slate-200">수</div>
      <div class="text-slate-200">목</div>
      <div class="text-slate-200">금</div>
      <div class="text-blue-400">토</div>
    </div>

    <!-- 달력 그리드 -->
    <div id="w_calendar_grid" class="grid grid-cols-7 gap-[2px] flex-1"></div>
  </div>

  <!-- 날짜 터치 시 빠른 메모 작성·수정 모달 -->
  <div id="w_memo_modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-[340px] p-3.5 space-y-2.5 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h3 id="w_modal_date" class="text-sm font-black text-white">10월 27일 (화) 메모</h3>
        <button onclick="WidgetApp.closeMemoModal()" class="text-slate-400 text-xl font-bold leading-none px-1">×</button>
      </div>
      <div class="text-[10px] text-amber-300 font-bold">
        💡 띄어쓰기 = 단어 줄바꿈 / 엔터 = 새 색상박스 구분
      </div>
      <textarea id="w_modal_textarea" rows="3" placeholder="메모를 입력하세요..." class="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white font-bold text-xs focus:outline-none focus:border-sky-400 box-border"></textarea>
      <div class="grid grid-cols-3 gap-1.5 text-xs font-black">
        <button onclick="WidgetApp.rerollColor()" class="py-2 rounded-xl bg-slate-800 text-slate-200 border border-slate-700">🎨 색변경</button>
        <button onclick="WidgetApp.deleteMemo()" class="py-2 rounded-xl bg-rose-950/80 text-rose-300 border border-rose-800/60">삭제</button>
        <button onclick="WidgetApp.saveMemo()" class="py-2 rounded-xl bg-sky-500 text-slate-950">💾 저장</button>
      </div>
    </div>
  </div>

  <!-- 최초 1회 열쇠(ghp_...) 등록 모달 -->
  <div id="w_token_modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-[340px] p-4 space-y-3 shadow-2xl text-xs">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h3 class="text-sm font-black text-white">🔑 위젯 클라우드 연동 설정</h3>
        <button onclick="WidgetApp.closeTokenModal()" class="text-slate-400 text-xl font-bold leading-none px-1">×</button>
      </div>
      <p class="text-[11px] text-slate-300 leading-relaxed">
        본앱에서 사용 중인 <strong class="text-sky-300">깃허브 열쇠 번호(ghp_...)</strong>를 한 번만 입력해 두면, 본앱의 메모와 근무가 위젯에 자동 동기화됩니다.
      </p>
      <input type="password" id="w_input_token" placeholder="ghp_ 로 시작하는 열쇠 붙여넣기" class="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white font-mono text-xs box-border">
      <button onclick="WidgetApp.saveTokenAndSync()" class="w-full py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-black">✔ 저장 및 지금 동기화</button>
    </div>
  </div>

  <script>
    const PASTEL_PALETTE = [
      { bg: '#fef08a', border: '#eab308' }, { bg: '#fecdd3', border: '#fb7185' },
      { bg: '#bae6fd', border: '#38bdf8' }, { bg: '#bbf7d0', border: '#4ade80' },
      { bg: '#e9d5ff', border: '#c084fc' }, { bg: '#fed7aa', border: '#fb923c' },
      { bg: '#c7d2fe', border: '#818cf8' }, { bg: '#d9f99d', border: '#a3e635' },
      { bg: '#f5d0fe', border: '#e879f9' }, { bg: '#a5f3fc', border: '#22d3ee' }
    ];

    const KoreanHolidayEngine = {
      cache: {},
      LUNAR_TABLE: {
        2024:['02-10','05-15','09-17'], 2025:['01-29','05-05','10-06'], 2026:['02-17','05-24','09-25'],
        2027:['02-07','05-13','09-15'], 2028:['01-27','05-02','10-03'], 2029:['02-13','05-20','09-22'],
        2030:['02-03','05-09','09-12'], 2031:['01-23','05-28','10-01'], 2032:['02-11','05-16','09-19']
      },
      fmt(y, m, d) { return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; },
      addDays(y, m, d, delta) {
        const dt = new Date(y, m - 1, d + delta, 12, 0, 0);
        return { y: dt.getFullYear(), m: dt.getMonth() + 1, d: dt.getDate(), dow: dt.getDay(), key: this.fmt(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()) };
      },
      buildYearHolidays(year) {
        if (this.cache[year]) return this.cache[year];
        const map = {}, occ = new Set();
        const [sMD, bMD, cMD] = this.LUNAR_TABLE[year] || ['02-01','05-15','09-20'];
        const pMD = (md) => { const [m, d] = md.split('-').map(Number); return { m, d }; };
        const s = pMD(sMD), b = pMD(bMD), c = pMD(cMD);
        const groups = [
          { days: [{ ...this.addDays(year,1,1,0), name:'신정' }], subRule:'NONE' },
          { days: [{ ...this.addDays(year,s.m,s.d,-1), name:'설연휴' }, { ...this.addDays(year,s.m,s.d,0), name:'설날' }, { ...this.addDays(year,s.m,s.d,1), name:'설연휴' }], subRule:'SUN_ONLY' },
          { days: [{ ...this.addDays(year,3,1,0), name:'삼일절' }], subRule:'SAT_SUN' },
          { days: [{ ...this.addDays(year,5,5,0), name:'어린이날' }], subRule:'SAT_SUN' },
          { days: [{ ...this.addDays(year,b.m,b.d,0), name:'부처님오신날' }], subRule:'SAT_SUN' },
          { days: [{ ...this.addDays(year,6,6,0), name:'현충일' }], subRule:'NONE' },
          { days: [{ ...this.addDays(year,8,15,0), name:'광복절' }], subRule:'SAT_SUN' },
          { days: [{ ...this.addDays(year,c.m,c.d,-1), name:'추석연휴' }, { ...this.addDays(year,c.m,c.d,0), name:'추석' }, { ...this.addDays(year,c.m,c.d,1), name:'추석연휴' }], subRule:'SUN_ONLY' },
          { days: [{ ...this.addDays(year,10,3,0), name:'개천절' }], subRule:'SAT_SUN' },
          { days: [{ ...this.addDays(year,10,9,0), name:'한글날' }], subRule:'SAT_SUN' },
          { days: [{ ...this.addDays(year,12,25,0), name:'성탄절' }], subRule:'SAT_SUN' }
        ];
        groups.forEach(g => {
          g.sub = 0;
          g.days.forEach(d => {
            const dup = occ.has(d.key); occ.add(d.key);
            if (!map[d.key] || d.name === '설날' || d.name === '추석') map[d.key] = d.name;
            if (g.subRule === 'SAT_SUN' && (d.dow === 0 || d.dow === 6 || dup)) g.sub++;
            else if (g.subRule === 'SUN_ONLY' && (d.dow === 0 || dup)) g.sub++;
          });
        });
        groups.forEach(g => {
          let cur = g.days[g.days.length - 1];
          while (g.sub > 0) {
            cur = this.addDays(cur.y, cur.m, cur.d, 1);
            if (cur.dow !== 0 && cur.dow !== 6 && !occ.has(cur.key)) { occ.add(cur.key); map[cur.key] = '대체공휴일'; g.sub--; }
          }
        });
        if (!map[this.fmt(year,5,1)]) map[this.fmt(year,5,1)] = '근로자의날';
        this.cache[year] = map;
        return map;
      },
      getHolidayName(y, m, d) { return this.buildYearHolidays(y)[this.fmt(y, m, d)] || null; }
    };

    const WidgetApp = {
      STORAGE_KEY: 'LGES_FINAL_APP_V4',
      WIDGET_MODE_KEY: 'LGES_WIDGET_VIEW_MODE',
      GIST_FILENAME: 'lges_pay_backup.json',
      ANCHOR_MONDAY: new Date(2026, 9, 19, 12, 0, 0),
      SHIFT_ORDER: ['EARLY', 'NIGHT', 'MID'],
      SHIFT_CHAR: { EARLY: '초', NIGHT: '야', MID: '중', OFF: '휴' },
      DAY_KOR: ['일', '월', '화', '수', '목', '금', '토'],

      year: 2026, month: 10,
      viewMode: 'MEMO_ONLY', // 'MEMO_ONLY' | 'WITH_WORK' | 'TWO_WEEKS'
      shiftOffset: 0,
      records: {},
      ghToken: '', ghGistId: '',
      fullPayloadCache: {},
      selectedKey: null,

      async init() {
        const now = new Date();
        this.year = now.getFullYear();
        this.month = now.getMonth() + 1;

        const savedMode = localStorage.getItem(this.WIDGET_MODE_KEY);
        if (savedMode) this.viewMode = savedMode;

        // URL 파라미터(?key=ghp_...)로 열쇠가 전달된 경우 자동 저장
        const urlParams = new URLSearchParams(window.location.search);
        const urlKey = urlParams.get('key') || urlParams.get('token');

        const localRaw = localStorage.getItem(this.STORAGE_KEY);
        if (localRaw) {
          try { this.applyPayload(JSON.parse(localRaw)); } catch (e) {}
        }
        if (urlKey && urlKey.startsWith('ghp_')) {
          this.ghToken = urlKey.trim();
          this.saveLocal();
        }

        this.updateModeBtn();
        this.render();

        // 토큰이 있으면 시작 시 자동으로 깃허브 금고에서 최신 메모 동기화
        if (this.ghToken) {
          await this.syncFromCloud(true);
        }
      },

      applyPayload(p) {
        if (!p || typeof p !== 'object') return;
        this.fullPayloadCache = { ...this.fullPayloadCache, ...p };
        if (p.shiftOffset !== undefined) this.shiftOffset = Number(p.shiftOffset) || 0;
        if (p.records && typeof p.records === 'object') this.records = p.records;
        if (p.ghToken) this.ghToken = p.ghToken;
        if (p.ghGistId) this.ghGistId = p.ghGistId;
      },

      saveLocal() {
        const merged = {
          ...this.fullPayloadCache,
          shiftOffset: this.shiftOffset,
          records: this.records,
          ghToken: this.ghToken,
          ghGistId: this.ghGistId
        };
        this.fullPayloadCache = merged;
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(merged));
      },

      cycleViewMode() {
        const modes = ['MEMO_ONLY', 'WITH_WORK', 'TWO_WEEKS'];
        this.viewMode = modes[(modes.indexOf(this.viewMode) + 1) % modes.length];
        localStorage.setItem(this.WIDGET_MODE_KEY, this.viewMode);
        this.updateModeBtn();
        this.render();
      },

      updateModeBtn() {
        const btn = document.getElementById('btn_w_mode');
        if (this.viewMode === 'MEMO_ONLY') btn.innerText = '📝메모만';
        else if (this.viewMode === 'WITH_WORK') btn.innerText = '🌙근무+메모';
        else btn.innerText = '🔍2주확대';
      },

      changeMonth(delta) {
        this.month += delta;
        if (this.month > 12) { this.month = 1; this.year++; }
        else if (this.month < 1) { this.month = 12; this.year--; }
        this.render();
      },

      goToday() {
        const now = new Date();
        this.year = now.getFullYear();
        this.month = now.getMonth() + 1;
        this.render();
      },

      getHeaders() {
        return {
          'Authorization': `Bearer ${this.ghToken}`,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28'
        };
      },

      async findGistId() {
        if (this.ghGistId) return this.ghGistId;
        const res = await fetch(`https://api.github.com/gists?per_page=100&_t=${Date.now()}`, { headers: this.getHeaders(), cache: 'no-store' });
        if (!res.ok) throw new Error('Gist 조회 실패');
        const list = await res.json();
        const found = list.find(g => g.files && g.files[this.GIST_FILENAME]);
        if (found) { this.ghGistId = found.id; return found.id; }
        return null;
      },

      async syncFromCloud(silent = true) {
        if (!this.ghToken) {
          if (!silent) this.openTokenModal();
          return;
        }
        const btn = document.getElementById('btn_w_sync');
        if (btn) btn.innerText = '⏳';
        try {
          const gistId = await this.findGistId();
          if (!gistId) throw new Error('백업 파일 없음');
          const res = await fetch(`https://api.github.com/gists/${gistId}?_t=${Date.now()}`, { headers: this.getHeaders(), cache: 'no-store' });
          if (!res.ok) throw new Error('로드 실패');
          const data = await res.json();
          const content = data.files?.[this.GIST_FILENAME]?.content;
          if (content) {
            this.applyPayload(JSON.parse(content));
            this.saveLocal();
            this.render();
          }
          if (btn) btn.innerText = '↻';
        } catch (e) {
          if (btn) btn.innerText = '⚠️';
          if (!silent) alert('동기화 실패: 우측 상단 🔑 버튼을 눌러 열쇠 번호(ghp_...)를 확인해 주세요.');
        }
      },

      async pushToCloud() {
        if (!this.ghToken) return;
        try {
          const gistId = await this.findGistId();
          if (!gistId) return;
          const exportData = { ...this.fullPayloadCache, records: this.records };
          delete exportData.ghToken;
          await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers: { ...this.getHeaders(), 'Content-Type': 'application/json' },
            body: JSON.stringify({ files: { [this.GIST_FILENAME]: { content: JSON.stringify(exportData, null, 2) } } })
          });
        } catch (e) {}
      },

      openTokenModal() {
        document.getElementById('w_input_token').value = this.ghToken || '';
        const m = document.getElementById('w_token_modal');
        m.classList.remove('hidden'); m.classList.add('flex');
      },
      closeTokenModal() {
        const m = document.getElementById('w_token_modal');
        m.classList.add('hidden'); m.classList.remove('flex');
      },
      async saveTokenAndSync() {
        this.ghToken = (document.getElementById('w_input_token').value || '').trim();
        this.ghGistId = '';
        this.saveLocal();
        this.closeTokenModal();
        await this.syncFromCloud(false);
      },

      onDateTap(key, y, m, d, dow) {
        this.selectedKey = key;
        const rec = this.records[key] || {};
        document.getElementById('w_modal_date').innerText = `${m}월 ${d}일 (${this.DAY_KOR[dow]}) 메모`;
        document.getElementById('w_modal_textarea').value = rec.memo || '';
        const modal = document.getElementById('w_memo_modal');
        modal.classList.remove('hidden'); modal.classList.add('flex');
      },
      closeMemoModal() {
        const modal = document.getElementById('w_memo_modal');
        modal.classList.add('hidden'); modal.classList.remove('flex');
        this.selectedKey = null;
      },
      rerollColor() {
        if (!this.selectedKey) return;
        const curr = this.records[this.selectedKey] || {};
        curr.memo = document.getElementById('w_modal_textarea').value.trim();
        curr.memoColor = ((curr.memoColor !== undefined ? curr.memoColor : 0) + 1 + Math.floor(Math.random() * 3)) % PASTEL_PALETTE.length;
        this.records[this.selectedKey] = curr;
        this.saveLocal(); this.render();
      },
      async deleteMemo() {
        if (!this.selectedKey) return;
        const curr = this.records[this.selectedKey] || {};
        delete curr.memo; delete curr.memoColor;
        if (!curr.type && !curr.compHol) delete this.records[this.selectedKey];
        else this.records[this.selectedKey] = curr;
        this.closeMemoModal();
        this.saveLocal(); this.render();
        await this.pushToCloud();
      },
      async saveMemo() {
        if (!this.selectedKey) return;
        const text = document.getElementById('w_modal_textarea').value.trim();
        const curr = this.records[this.selectedKey] || {};
        curr.memo = text;
        if (text && curr.memoColor === undefined) curr.memoColor = Math.floor(Math.random() * PASTEL_PALETTE.length);
        if (!curr.memo && !curr.type && !curr.compHol) delete this.records[this.selectedKey];
        else this.records[this.selectedKey] = curr;
        this.closeMemoModal();
        this.saveLocal(); this.render();
        await this.pushToCloud();
      },

      getDefaultShift(y, m, d) {
        const dow = new Date(y, m - 1, d, 12, 0, 0).getDay();
        const mon = new Date(y, m - 1, d + (dow === 0 ? -6 : 1 - dow), 12, 0, 0);
        const weeks = Math.round((mon.getTime() - this.ANCHOR_MONDAY.getTime()) / (7 * 86400000));
        return this.SHIFT_ORDER[(((weeks + this.shiftOffset) % 3) + 3) % 3];
      },

      getDatesToRender() {
        if (this.viewMode === 'TWO_WEEKS') {
          const now = new Date();
          const dow = now.getDay();
          const startSun = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow, 12, 0, 0);
          const list = [];
          for (let i = 0; i < 14; i++) {
            const dt = new Date(startSun.getFullYear(), startSun.getMonth(), startSun.getDate() + i, 12, 0, 0);
            list.push({ y: dt.getFullYear(), m: dt.getMonth() + 1, d: dt.getDate(), isOther: false });
          }
          return list;
        }
        const firstDow = new Date(this.year, this.month - 1, 1, 12, 0, 0).getDay();
        const dim = new Date(this.year, this.month, 0).getDate();
        const list = [];
        for (let i = firstDow - 1; i >= 0; i--) {
          const dt = new Date(this.year, this.month - 1, -i, 12, 0, 0);
          list.push({ y: dt.getFullYear(), m: dt.getMonth() + 1, d: dt.getDate(), isOther: true });
        }
        for (let d = 1; d <= dim; d++) list.push({ y: this.year, m: this.month, d, isOther: false });
        const rem = (7 - (list.length % 7)) % 7;
        for (let i = 1; i <= rem; i++) {
          const dt = new Date(this.year, this.month, i, 12, 0, 0);
          list.push({ y: dt.getFullYear(), m: dt.getMonth() + 1, d: dt.getDate(), isOther: true });
        }
        return list;
      },

      escapeHtml(s) { return s.replace(/[&<>"']/g, m => ({ '&':'&','<':'<','>':'>','"':'"',"'":''' }[m])); },

      render() {
        const now = new Date();
        const todayKey = KoreanHolidayEngine.fmt(now.getFullYear(), now.getMonth() + 1, now.getDate());
        document.getElementById('w_month_title').innerText = `${this.month}월`;
        document.getElementById('w_today_sub').innerText = `${now.getMonth()+1}.${now.getDate()} (${this.DAY_KOR[now.getDay()]})`;

        const dates = this.getDatesToRender();
        const isZoom = (this.viewMode === 'TWO_WEEKS');
        const showWork = (this.viewMode === 'WITH_WORK');
        const minH = isZoom ? 'min-h-[115px]' : (dates.length > 35 ? 'min-h-[64px]' : 'min-h-[76px]');

        const grid = document.getElementById('w_calendar_grid');
        grid.innerHTML = '';

        dates.forEach(dt => {
          const key = KoreanHolidayEngine.fmt(dt.y, dt.m, dt.d);
          const dow = new Date(dt.y, dt.m - 1, dt.d, 12, 0, 0).getDay();
          const rec = this.records[key] || {};
          const holName = KoreanHolidayEngine.getHolidayName(dt.y, dt.m, dt.d) || (rec.compHol ? '회사휴일' : null);
          const isRed = (dow === 0 || Boolean(holName));
          const isSat = (dow === 6 && !holName);
          const isToday = (key === todayKey);

          let numColor = 'text-slate-100';
          if (isRed) numColor = 'text-red-500';
          else if (isSat) numColor = 'text-blue-400';

          // 오늘 날짜(27)는 사진 속 위젯처럼 흰색 네모 배지로 선명하게 강조
          const dateNumHtml = isToday
            ? `<span class="bg-white text-slate-950 font-black text-[11px] px-1.5 py-[1px] rounded-[4px] leading-tight shadow">${dt.d}</span>`
            : `<span class="text-[11.5px] font-extrabold ${numColor} leading-tight">${dt.d}</span>`;

          let shiftBadgeHtml = '';
          if (showWork) {
            const defShift = this.getDefaultShift(dt.y, dt.m, dt.d);
            let sh = rec.shift || defShift;
            let type = rec.type || ((dow === 0 || dow === 6 || holName) ? 'OFF' : 'NORMAL');
            let bKey = type === 'OFF' ? 'OFF' : (type === 'HOLIDAY' ? (rec.holKind === 'NIGHT' ? 'NIGHT' : 'EARLY') : sh);
            shiftBadgeHtml = `<span class="w-3.5 h-3.5 rounded-[3px] flex items-center justify-center text-[8px] font-black badge-${bKey}">${this.SHIFT_CHAR[bKey]}</span>`;
          }

          const chips = [];
          if (showWork && rec.type) {
            if (rec.type === 'HOLIDAY') {
              const h = rec.hours !== undefined ? Number(rec.hours) : 12;
              chips.push(rec.holKind === 'NIGHT'
                ? `<div class="w-work-chip bg-purple-950/90 text-purple-200 border border-purple-700/70">야특${h}h</div>`
                : `<div class="w-work-chip bg-red-950/90 text-red-200 border border-red-700/70">주특${h}h</div>`);
            } else if (rec.type === 'OT') {
              chips.push(`<div class="w-work-chip bg-sky-950/90 text-sky-200 border border-sky-700/70">+${rec.hours}h잔업</div>`);
            } else if (rec.type === 'NIGHT_OT') {
              chips.push(`<div class="w-work-chip bg-indigo-950/90 text-indigo-200 border border-indigo-700/70">+${rec.hours}h야잔</div>`);
            } else if (rec.type === 'LEAVE') {
              const vh = Math.round((rec.vacDays || 1) * 8);
              chips.push(`<div class="w-work-chip bg-emerald-950/90 text-emerald-200 border border-emerald-700/70">🌴휴가${vh}h</div>`);
            }
          }

          const memo = (rec.memo || '').trim();
          if (memo) {
            const baseColor = rec.memoColor !== undefined ? Number(rec.memoColor) : ((dt.y * 37 + dt.m * 13 + dt.d * 7) % PASTEL_PALETTE.length);
            memo.split('\n').map(l => l.trim()).filter(Boolean).forEach((line, idx) => {
              const pal = PASTEL_PALETTE[(baseColor + idx * 3) % PASTEL_PALETTE.length];
              chips.push(`<div class="w-memo-chip ${isZoom ? 'w-memo-chip-zoom' : ''}" style="background-color:${pal.bg}; border:1px solid ${pal.border};">${this.escapeHtml(line)}</div>`);
            });
          }

          const cell = document.createElement('div');
          cell.className = `p-1 ${minH} flex flex-col justify-start gap-0.5 rounded-lg cursor-pointer active:bg-slate-800/70 transition ${dt.isOther ? 'opacity-25' : ''} ${isToday ? 'today-cell-box' : 'bg-slate-900/35'}`;
          cell.onclick = () => this.onDateTap(key, dt.y, dt.m, dt.d, dow);
          cell.innerHTML = `
            <div class="flex items-center ${showWork ? 'justify-between' : 'justify-center'} mb-0.5 px-0.5">
              ${dateNumHtml}
              ${shiftBadgeHtml}
            </div>
            <div class="flex flex-col gap-[2px] w-full">${chips.join('')}</div>
          `;
          grid.appendChild(cell);
        });
      }
    };

    window.addEventListener('DOMContentLoaded', () => WidgetApp.init());
  </script>
</body>
</html>
