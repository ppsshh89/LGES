<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LGES 월급·퇴직금 계산기</title>
</head>
<body style="background:#0f172a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;">
  <div id="status_msg" style="font-size:14px;font-weight:bold;line-height:1.7;padding:20px;">
    ⏳ 깃허브 타임머신에서 어제 잘 되던 화면을 복구하는 중입니다...<br>
    <span style="font-size:11px;color:#38bdf8;font-weight:normal;">(최초 1회만 약 2~3초 소요됩니다)</span>
  </div>
  <script>
  (async function() {
    const CACHE_KEY = 'LGES_TIMEMACHINE_RESTORED_V1';
    function launchApp(html) {
      let clean = html.replace(/navigator\.serviceWorker\.register\([^)]*\)/g, '');
      clean = clean.replace(/window\.addEventListener\(['"]DOMContentLoaded['"],\s*\(\)\s*=>\s*App\.init\(\)\)/g, 'setTimeout(()=>App.init(), 50)');
      clean = clean.replace('</body>', '<script>setTimeout(()=>{if(window.App&&document.getElementById("calendar_grid")&&!document.getElementById("calendar_grid").children.length)App.init();},120);<\/script></body>');
      document.open(); document.write(clean); document.close();
    }
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) await r.unregister();
      }
      const savedHtml = localStorage.getItem(CACHE_KEY);
      if (savedHtml && savedHtml.length > 20000) { launchApp(savedHtml); return; }

      const res = await fetch('https://api.github.com/repos/ppsshh89/ppsshh89.github.io/commits?path=index.html&per_page=50&_t=' + Date.now());
      const commits = await res.json();
      for (const c of commits) {
        const raw = await fetch('https://raw.githubusercontent.com/ppsshh89/ppsshh89.github.io/' + c.sha + '/index.html');
        const txt = await raw.text();
        const docCount = (txt.match(/<!DOCTYPE html>/gi) || []).length;
        if (docCount === 1 && txt.length > 20000 && !txt.includes('quick_12month_grid') && txt.includes('App.init') && txt.trim().endsWith('</html>')) {
          localStorage.setItem(CACHE_KEY, txt);
          launchApp(txt);
          return;
        }
      }
      throw new Error('이전 버전을 찾지 못했습니다.');
    } catch (e) {
      document.getElementById('status_msg').innerHTML = '⚠️ 복구 중 오류: ' + e.message;
    }
  })();
  </script>
</body>
</html>
